name: Tests

on:
  push:
    branches: [subdocs]
  pull_request:
    branches: [subdocs]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: indexer_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d indexer_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MCP_INDEXER_TEST_DB_URL: postgresql+psycopg://postgres:postgres@localhost:5432/indexer_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run test suite
        run: python -m pytest -m "not long_cpu"
