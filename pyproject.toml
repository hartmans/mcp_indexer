[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-indexer"
version = "0.1.0"
description = "An MCP server for indexing and retrieving document collections"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = [
    "pydantic",
    "mcp>=2.2.0,<3",
    "langchain",
    "langchain-openai",
    "pgvector",
    "sqlalchemy",
    "psycopg[binary]",
    "PyYAML",
]

[project.optional-dependencies]
rerank = [
    "accelerate",
    "bitsandbytes",
    "torch",
    "transformers>=4.51",
]
# Optional: real conversion of PDF and office formats, with OCR.
# RapidOCR runs on the PyTorch backend, so torch/torchvision are required.
docling = [
    "docling>=2.138.0",
    "rapidocr>=3.10.0",
    "torch",
    "torchvision",
]
# Optional: Wikipedia source plugin (MediaWiki parsing plus Xapian keyword
# lookup and native search). Both imports are deferred inside the plugin, so
# it loads without them; they are only needed when a wikipedia collection runs.
wikipedia = [
    "mwparserfromhell",
    "xapian",
]
test = [
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools.packages.find]
include = ["mcp_indexer*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "long_cpu: slow real-conversion tests (Docling OCR on CPU); skip with -m 'not long_cpu'",
]
